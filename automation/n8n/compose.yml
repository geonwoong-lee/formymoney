services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Asia/Seoul
      GENERIC_TIMEZONE: Asia/Seoul
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      VERY_RICH_API_BASE_URL: ${VERY_RICH_API_BASE_URL:-http://host.docker.internal:8000}
      VERY_RICH_N8N_INGEST_SECRET: ${VERY_RICH_N8N_INGEST_SECRET:?VERY_RICH_N8N_INGEST_SECRET is required}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro

volumes:
  n8n_data:
